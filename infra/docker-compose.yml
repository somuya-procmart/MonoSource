# Development dependencies only. Not a production deployment.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: monosource, POSTGRES_HOST_AUTH_METHOD: trust }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
volumes: { pgdata: {} }
