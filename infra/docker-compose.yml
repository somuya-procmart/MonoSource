# Development dependencies only. Not a production deployment (production: Supabase, see DEPLOY.md).
# Postgres 17 + pgvector, like Supabase. Port 54322 = the port Supabase's local stack uses.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_DB: monosource, POSTGRES_HOST_AUTH_METHOD: trust }
    ports: ["54322:5432"]
    volumes: [pgdata17:/var/lib/postgresql/data]
volumes: { pgdata17: {} }
